name: healthz
port: 23100

server:
  host: "0.0.0.0"
  prefork: true
  timeout: 30s
  body_limit: 4194304
  max_conns: 10000
  api_prefix: ""
  shutdown_timeout: 10s
  health_enabled: true
  startup_enabled: true
  readiness_enabled: true
  liveness_enabled: true
  middleware:
    - path: "/*"
      apply: []

entry:
  - type: rest
    method: GET
    path: /ping
    handler: ping
