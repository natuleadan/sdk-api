name: scalar-ui-bench
services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: postgres
    ports:
      - "24101:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 2s
      timeout: 2s
      retries: 10

  bench:
    build:
      context: ../../../..
      dockerfile: sdk-api/examples/100-base/scalar-ui/Dockerfile
    ports:
      - "23101:23101"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCKER_TEST: "1"
      DATABASE_URL: postgres://dev:devpass@postgres:5432/postgres?sslmode=disable
