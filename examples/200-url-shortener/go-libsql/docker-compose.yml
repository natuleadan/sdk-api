name: url-shortener-go-libsql-bench
services:
  bench:
    build:
      context: ../../../..
      dockerfile: sdk-api/examples/200-url-shortener/go-libsql/Dockerfile
    ports:
      - "23211:23211"
    environment:
      DOCKER_TEST: "1"
      TURSO_DATABASE_URL: "${TURSO_DATABASE_URL}"
      TURSO_AUTH_TOKEN: "${TURSO_AUTH_TOKEN}"
