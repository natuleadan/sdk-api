name: url-shortener-turso-serverless-bench
services:
  bench:
    build:
      context: ../../../..
      dockerfile: sdk-api/examples/200-url-shortener/turso-serverless/Dockerfile
    ports:
      - "23209:23209"
    environment:
      DOCKER_TEST: "1"
      TURSO_DATABASE_URL: "${TURSO_DATABASE_URL}"
      TURSO_AUTH_TOKEN: "${TURSO_AUTH_TOKEN}"
