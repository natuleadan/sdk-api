name: 300-file-storage-pg-nats
services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 3s
      timeout: 3s
      retries: 10

  pgdog:
    image: ghcr.io/pgdogdev/pgdog:v0.1.44
    volumes:
      - ./pgdog.toml:/pgdog/pgdog.toml:ro
      - ./users.toml:/pgdog/users.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: psql -h127.0.0.1 -p6432 -Udev -dpostgres -c 'SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  nats:
    image: nats:2.14-alpine
    command: ["-js"]

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000 && echo ok || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10


  bench:
    build:
      context: ../../../..
      dockerfile: sdk-api/examples/300-file-storage/pg-nats/Dockerfile
    ports:
      - "23304:23304"
    depends_on:
      postgres:
        condition: service_healthy
      pgdog:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DOCKER_TEST: "1"
      DATABASE_URL: postgres://dev:devpass@pgdog:6432/postgres?sslmode=disable
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dummy-bucket
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      PORT: "23304"

volumes:
  rustfs-data:
