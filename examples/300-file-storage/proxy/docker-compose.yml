name: 300-file-storage-proxy
services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000 && echo ok || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10


  bench:
    build:
      context: ../../../..
      dockerfile: sdk-api/examples/300-file-storage/proxy/Dockerfile
    ports:
      - "23303:23303"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      DOCKER_TEST: "1"
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dummy-bucket
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      PORT: "23303"
