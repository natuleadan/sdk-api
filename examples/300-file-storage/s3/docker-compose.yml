name: 300-file-storage-s3
services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000 && echo ok || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set s3 http://rustfs:9000 rustfsadmin rustfsadmin &&
      mc mb s3/dummy-bucket --ignore-existing &&
      echo 'Bucket ready'
      "

  bench:
    build:
      context: ../../../..
      dockerfile: sdk-api/examples/300-file-storage/s3/Dockerfile
    ports:
      - "23305:23305"
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment:
      DOCKER_TEST: "1"
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: dummy-bucket
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      PORT: "23305"

volumes:
  rustfs-data:
