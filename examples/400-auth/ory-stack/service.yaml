name: auth-ory-stack
port: 23400

server:
  host: "0.0.0.0"
  prefork: false
  timeout: 30s
  body_limit: 4194304
  max_conns: 10000
  health_path: /healthz
  api_prefix: /api
  shutdown_timeout: 10s
  middleware:
    - path: "/*"
      apply: [logger]
  security:
    encrypt_cookie:
      enabled: true
      key: "${ENCRYPT_COOKIE_KEY}"
      except:
        - "csrf_token"
        # Kratos issues and validates this cookie itself; it is opaque, not
        # encrypted by this service, so it must not be decrypted here.
        - "ory_session"
  # The API authenticates with Bearer (introspection) or API keys, never with
  # cookies, so CSRF does not apply.
  csrf:
    enabled: true
    json_check: true
    exclude_paths:
      - "/api/no-csrf"
  security_headers:
    frame_options: DENY
    referrer_policy: no-referrer
    permissions_policy: "camera=(), microphone=()"
    hsts: false
    csp_config:
      level: basic
      default_src: ["'self'"]
      script_src: ["'self'"]
      style_src: ["'self'"]
      img_src: ["'self'", "data:"]
  cors:
    # credentials:true forbids origins ["*"] (Fiber panics at startup).
    origins: ["http://localhost:23400", "http://example.com"]
    methods: ["GET", "POST", "PATCH", "DELETE", "OPTIONS"]
    headers: ["Content-Type", "Authorization", "X-CSRF-Token", "X-Debug"]
    credentials: true
    max_age: 3600
  rate_limit:
    enabled: true
    kv: cache-main
    algorithm: token_bucket
    ttl: 5m

kv:
  - name: cache-main
    driver: redis
    url: "${REDIS_URL}"

databases:
  - name: primary
    driver: postgres
    url: "${DATABASE_URL}"
    pool:
      max_conns: 50
      min_conns: 2
      reserved_conns: 5

# Identity comes from Ory Kratos (sessions validated through /sessions/whoami);
# authorization is 100% Ory Keto (ReBAC tuples). Role names are arbitrary:
# list them in entries or in role_permissions. Keto namespace/relations default
# to roles#assignee (role) and <resource>#perform (permission).
auth:
  enabled: true
  driver: ory
  kratos_url: "${KRATOS_URL}"
  kratos_admin_url: "${KRATOS_ADMIN_URL}"
  keto_read_url: "${KETO_READ_URL}"
  keto_write_url: "${KETO_WRITE_URL}"
  ory:
    role_namespace: "roles"
    role_relation: "assignee"
    permission_relation: "perform"
  role_permissions:
    admin: ["users:manage"]
    facturacion-lectura: ["products:read"]

entry:
  # ---- products (any authenticated subject) ----
  - type: rest
    method: GET
    path: /products
    handler: listProducts
    auth_modes: [session, apikey]
    api_key_prefix: "sk-"

  - type: rest
    method: POST
    path: /products
    handler: createProduct
    auth_modes: [session, apikey]
    api_key_prefix: "sk-"
    roles: ["editor"]

  - type: rest
    method: GET
    path: /products/:id
    handler: getProduct
    auth_modes: [session, apikey]
    api_key_prefix: "sk-"

  - type: rest
    method: PATCH
    path: /products/:id
    handler: updateProduct
    auth_modes: [session, apikey]
    api_key_prefix: "sk-"
    roles: ["editor"]

  - type: rest
    method: DELETE
    path: /products/:id
    handler: deleteProduct
    auth_modes: [session, apikey]
    api_key_prefix: "sk-"
    roles: ["editor"]

  # ---- admin (role-gated through OpenFGA) ----
  - type: rest
    method: DELETE
    path: /admin/products/:id/hard
    handler: hardDeleteProduct
    auth_modes: [session]
    roles: ["admin"]

  - type: rest
    method: PATCH
    path: /admin/products/:id/visibility
    handler: setVisibility
    auth_modes: [session]
    roles: ["admin"]

  - type: rest
    method: GET
    path: /admin/products/:id/audit
    handler: getAuditLog
    auth_modes: [session]
    roles: ["admin"]

  - type: rest
    method: GET
    path: /admin/users
    handler: listUsers
    auth_modes: [session]
    roles: ["admin"]
    permissions: ["users:manage"]

  - type: rest
    method: DELETE
    path: /admin/users/:id
    handler: deleteUser
    auth_modes: [session]
    roles: ["admin"]
    permissions: ["users:manage"]

  - type: rest
    method: PATCH
    path: /admin/users/:id/role
    handler: setUserRole
    auth_modes: [session]
    roles: ["admin"]
    permissions: ["users:manage"]

  - type: rest
    method: GET
    path: /cookie/profile
    handler: cookieProfile
    auth_modes: [session]
    jwt_from: "cookie:token"

  # ---- rate limiting (logic only) ----
  - type: rest
    method: POST
    path: /rate-limited
    handler: rateLimitedHandler
    auth_modes: [session, apikey]
    api_key_prefix: "sk-"
    rate_limit:
      requests_per_second: 10
      burst: 20
    rate_limit_per_user:
      requests_per_second: 5
      burst: 10
    rate_limit_per_key:
      requests_per_second: 10
      burst: 20

  - type: rest
    method: POST
    path: /per-role-limited
    handler: perRoleLimited
    auth_modes: [session]
    roles: ["admin", "editor", "viewer"]
    rate_limit_per_role:
      admin:
        requests_per_second: 5
        burst: 10
      editor:
        requests_per_second: 3
        burst: 6
      viewer:
        requests_per_second: 1
        burst: 2

  - type: rest
    method: GET
    path: /viewer-data
    handler: viewerDataHandler
    auth_modes: [session]
    roles: ["viewer"]

  - type: rest
    method: GET
    path: /admin/dual-products
    handler: listProducts
    auth_modes: [session, apikey]
    api_key_prefix: "sk-"
    roles: ["admin"]

  # ---- delegated roles + teams (Keto-backed) ----
  - type: rest
    method: POST
    path: /auth/grants
    handler: grantRole
    auth_modes: [session]
    roles: ["admin"]

  - type: rest
    method: DELETE
    path: /auth/grants/:id/:role
    handler: revokeRole
    auth_modes: [session]
    roles: ["admin"]

  - type: rest
    method: GET
    path: /me/roles
    handler: myRoles
    auth_modes: [session]

  - type: rest
    method: GET
    path: /teams
    handler: listTeams
    auth_modes: [session]
    roles: ["admin"]

  - type: rest
    method: POST
    path: /teams
    handler: createTeam
    auth_modes: [session]
    roles: ["admin"]

  # ---- Hydra OAuth2/OIDC login + consent providers ----
  - type: rest
    method: GET
    path: /oauth/login
    handler: hydraLogin
    auth_modes: [session]
    csrf: false

  - type: rest
    method: GET
    path: /oauth/consent
    handler: hydraConsent
    auth_modes: [session]
    csrf: false

  - type: rest
    method: GET
    path: /oauth/logout
    handler: hydraLogout
    auth_modes: [session]
    csrf: false


  # ---- rate limiting (logic only) ----
  - type: rest
    method: POST
    path: /per-user-limited
    handler: perUserLimited
    auth_modes: [session]
    rate_limit_per_user:
      requests_per_second: 2
      burst: 4

  - type: rest
    method: POST
    path: /per-key-limited
    handler: perKeyLimited
    auth_modes: [apikey]
    api_key_prefix: "sk-"
    rate_limit_per_key:
      requests_per_second: 3
      burst: 6

  - type: rest
    method: POST
    path: /max-func-limited
    handler: maxFuncLimited
    auth_modes: [session]
    rate_limit_per_user:
      requests_per_second: 1
      burst: 2

  - type: rest
    method: POST
    path: /no-csrf
    handler: noCSRFHandler
    csrf: false

  # ---- tenant-scoped CRUD ----
  - type: crud
    model: TenantProduct
    resource: tenant-products
    auth_modes: [session]
    db: primary
    tenant_scope: org_id
    tenant_field: tenant_id
